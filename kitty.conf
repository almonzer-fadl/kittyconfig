# =========================================================
# Fonts
# =========================================================
font_family      SF Mono
bold_font        SF Mono Bold
italic_font      SF Mono Italic
bold_italic_font SF Mono Bold Italic
font_size        13.0

# =========================================================
# Window Layout & Padding
# =========================================================
hide_window_decorations titlebar-only
macos_titlebar_color    background
window_padding_width    20
window_margin_width     0
enabled_layouts         splits:split_axis=horizontal

# =========================================================
# Keymaps
# =========================================================
map f5 launch --location=hsplit
map cmd+shift+d launch --location=hsplit
map ctrl+shift+d launch --location=vsplit
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard
map cmd+k clear_terminal scroll active
map cmd+t new_tab
map cmd+w close_tab
map cmd+shift+] next_tab
map cmd+shift+[ previous_tab
map ctrl+shift+1 goto_tab 1
map ctrl+shift+2 goto_tab 2
map ctrl+shift+3 goto_tab 3
map ctrl+shift+4 goto_tab 4
map ctrl+shift+5 goto_tab 5
map ctrl+shift+6 goto_tab 6
map ctrl+shift+7 goto_tab 7
map ctrl+shift+8 goto_tab 8
map ctrl+shift+9 goto_tab 9
map ctrl+shift+r reload_config
map ctrl+left resize_window narrower
map ctrl+right resize_window wider
map ctrl+up resize_window taller
map ctrl+down resize_window shorter 3
map ctrl+home resize_window reset

# =========================================================
# Theme: Clean Minimal Light
# =========================================================
background              #ffffff
foreground              #24292f
selection_background    #cbe2f9
selection_foreground    none

# Cursor
cursor                  #24292f
cursor_text_color       #ffffff
cursor_shape            block
cursor_blink_interval   0

# URLs
url_color               #0969da
url_style               straight

# Tabs Layout & Colors
tab_bar_edge            top
tab_bar_style           powerline
tab_fade                0
tab_title_template      " {index} "
tab_separator           ""
tab_bar_background      #f0f2f5
active_tab_background   #ffffff
active_tab_foreground   #1f2328
active_tab_font_style   bold
inactive_tab_background #e1e4e8
inactive_tab_foreground #656d76

# Border Colors
active_border_color     #0969da
inactive_border_color   #d0d7de

# 16-color ANSI Palette (High contrast, clean & minimal, no jarring neon)
# Black & Dark Grays
color0                  #24292f
color8                  #6e7781

# Red
color1                  #cf222e
color9                  #a40e26

# Green (Readable forest green, not neon)
color2                  #1a7f37
color10                 #116329

# Yellow / Amber (High contrast against white background)
color3                  #9a6700
color11                 #6e4b00

# Blue
color4                  #0969da
color12                 #0550ae

# Magenta / Purple
color5                  #8250df
color13                 #6639ba

# Cyan / Teal
color6                  #1b7c83
color14                 #0e6066

# White & Light Grays (Tuned to readable slate/grays so ANSI white text is visible)
color7                  #57606a
color15                 #8c959f
