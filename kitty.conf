# =========================================================
# Keymaps / Window Actions
# =========================================================
map f5 launch --location=hsplit
enabled_layouts splits:split_axis=horizontal

map cmd+shift+d launch --location=hsplit
map ctrl+shift+d launch --location=vsplit
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard
map cmd+k clear_terminal scroll active
map cmd+t new_tab
map cmd+w close_tab
map cmd+shift+] next_tab
map cmd+shift+[ previous_tab
map ctrl+shift+1 goto_tab 1
map ctrl+shift+2 goto_tab 2
map ctrl+shift+3 goto_tab 3
map ctrl+shift+4 goto_tab 4
map ctrl+shift+5 goto_tab 5
map ctrl+shift+6 goto_tab 6
map ctrl+shift+7 goto_tab 7
map ctrl+shift+8 goto_tab 8
map ctrl+shift+9 goto_tab 9
map ctrl+shift+r noop
map ctrl+shift+r reload_config
map ctrl+left resize_window narrower
map ctrl+right resize_window wider
map ctrl+up resize_window taller
map ctrl+down resize_window shorter 3
map ctrl+home resize_window reset

# =========================================================
# Font
# =========================================================
font_family      SF Mono
bold_font        SF Mono Bold
italic_font      SF Mono Italic
bold_italic_font SF Mono Bold Italic
font_size        13

# =========================================================
# macOS Chrome & Padding
# =========================================================
hide_window_decorations titlebar-only
macos_titlebar_color    background
window_padding_width    20
window_margin_width     0

# =========================================================
# Tabs Layout
# =========================================================
tab_bar_edge            top
tab_bar_style           powerline
tab_fade                0
tab_title_template      " {index} "
tab_separator           ""
